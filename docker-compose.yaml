version: '3.8'

services:
  mongo:
    image: mongo:5.0
    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: pass  
    volumes:
      - mongodata:/data/db


  myapi:
    build: ./
    ports:
      - "3000:3000"

    depends_on:
      - mongo  

    environment:
      MONGO_URI: mongodb://dev:pass@mongo:27017        

volumes:
  - mongodata:      